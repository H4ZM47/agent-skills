name: Test Plugin Installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Claude plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  validate-cursor-plugin:
    name: Validate Cursor plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install AJV (schema validation)
        run: npm install --no-save ajv@8 ajv-formats@3

      - name: Validate .cursor-plugin against vendored schemas
        run: node scripts/validate-cursor-plugin.mjs

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    needs: [validate, validate-cursor-plugin]
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install agent-skills@addy-agent-skills --scope user
